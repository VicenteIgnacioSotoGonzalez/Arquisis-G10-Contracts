name: Contract tests E1 and E2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run E1 and E2 contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate E2 fixtures against official v3.0.1
        run: python scripts/check_v3_examples.py
