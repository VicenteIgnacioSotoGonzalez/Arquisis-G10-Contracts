name: Contracts v2 and v3

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review-only
          POSTGRES_DB: energyshark_test_contracts_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review -d energyshark_test_contracts_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: coniverav/E0-Arquisis-local
          ref: develop
          path: _backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
        env:
          ENERGYSHARK_BACKEND_ROOT: ${{ github.workspace }}/_backend
      - run: python -m pip install -r _backend/master/requirements.txt
      - name: Validar emisores y flujo integrado del backend contra schemas oficiales
        working-directory: _backend/master
        env:
          DATABASE_URL: postgresql+psycopg://review:review-only@127.0.0.1:5432/energyshark_test_contracts_ci
        run: python -m pytest -q tests/test_contracts_v3.py tests/test_seller_offer_integration.py tests/test_e2045_seller_cycle.py tests/test_e2045_buyer_cycle.py
