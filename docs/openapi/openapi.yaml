openapi: 3.1.0
info:
  title: EnergyShark E2 API
  version: 3.0.2
paths:
  /cycles:
    get:
      tags:
      - cycles
      summary: List Cycles
      operationId: list_cycles_cycles_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CyclesOut'
  /cycles/{cycle_id}:
    get:
      tags:
      - cycles
      summary: Cycle Detail
      operationId: cycle_detail_cycles__cycle_id__get
      parameters:
      - name: cycle_id
        in: path
        required: true
        schema:
          type: string
          title: Cycle Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleDetailOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cycles/{cycle_id}/history:
    get:
      tags:
      - cycles
      summary: Cycle History
      description: 'RF01/E2-056: estado e historial E2, sin efectos ni secretos de
        wallet.'
      operationId: cycle_history_cycles__cycle_id__history_get
      parameters:
      - name: cycle_id
        in: path
        required: true
        schema:
          type: string
          title: Cycle Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleHistoryOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/messages:
    post:
      tags:
      - internal
      summary: Ingest Protocol Message
      description: 'Procesa mensajes E1 ya validados por el connector.


        La recepción se persiste primero como evidencia durable.

        La lógica de negocio y el resultado de auditoría se confirman

        posteriormente dentro de una misma transacción.'
      operationId: ingest_protocol_message_internal_messages_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtocolMessageIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/audit/outbound:
    post:
      tags:
      - internal-audit
      summary: Create Outbound Audit
      description: Registra durablemente la intención de publicar un mensaje.
      operationId: create_outbound_audit_internal_audit_outbound_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundMessageAuditIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/audit/outbound/dispatch:
    get:
      tags:
      - internal-audit
      summary: List Outbound Dispatch
      description: 'Entrega al connector mensajes creados por el backend

        que todavía requieren publicación en RabbitMQ.'
      operationId: list_outbound_dispatch_internal_audit_outbound_dispatch_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/audit/outbound/{msg_id}/reserve-quota:
    post:
      tags:
      - internal-audit
      summary: Reserve Outbound Quota
      description: Reserva el cupo de publicación compartido antes del envío AMQP.
      operationId: reserve_outbound_quota_internal_audit_outbound__msg_id__reserve_quota_post
      parameters:
      - name: msg_id
        in: path
        required: true
        schema:
          type: string
          title: Msg Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/audit/outbound/{msg_id}/result:
    post:
      tags:
      - internal-audit
      summary: Update Outbound Audit
      description: Registra el resultado del intento de publicación.
      operationId: update_outbound_audit_internal_audit_outbound__msg_id__result_post
      parameters:
      - name: msg_id
        in: path
        required: true
        schema:
          type: string
          title: Msg Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundMessageResultIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/audit/inbound/market:
    post:
      tags:
      - internal-audit
      summary: Receive Market Feed
      description: Confirma la recepción solo después de persistir inbox, claim y
        snapshot.
      operationId: receive_market_feed_internal_audit_inbound_market_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketFeedMessageIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundMessageAuditOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/audit/inbound/market-gap:
    post:
      tags:
      - internal-audit
      summary: Note Market Feed Gap
      description: Connector registra posible pérdida antes de reanudar la cola market.
      operationId: note_market_feed_gap_internal_audit_inbound_market_gap_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketFeedGapIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/audit/inbound:
    post:
      tags:
      - internal-audit
      summary: Create Inbound Audit
      operationId: create_inbound_audit_internal_audit_inbound_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundMessageAuditIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundMessageAuditOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - internal-audit
      summary: List Inbound Audit
      operationId: list_inbound_audit_internal_audit_inbound_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - DUPLICATE
            - DISCARDED
            - NACKED
            type: string
          - type: 'null'
          title: Status
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
      - name: reasonCode
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Reasoncode
      - name: msgId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Msgid
      - name: idpk
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idpk
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundMessageAuditListOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /audit/anomalies:
    get:
      tags:
      - audit
      summary: List Audit Anomalies
      operationId: list_audit_anomalies_audit_anomalies_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - DUPLICATE
            - DISCARDED
            - NACKED
            type: string
          - type: 'null'
          title: Status
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
      - name: reasonCode
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Reasoncode
      - name: msgId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Msgid
      - name: idpk
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idpk
      - name: sender
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sender
      - name: cycleId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cycleid
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditAnomalyListOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /negotiations:
    get:
      tags:
      - negotiations
      summary: List Negotiations
      operationId: list_negotiations_negotiations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NegotiationsOut'
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - negotiations
      summary: Create Negotiation
      description: 'Crea una negociación voluntaria y deja su

        negotiation-proposal pendiente de publicación.


        Requiere JWT válido. La idempotencia es por idpk:

        un reintento con el mismo idpk devuelve la

        negociación existente con 200.'
      operationId: create_negotiation_negotiations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NegotiationCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NegotiationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /negotiations/{negotiation_id}:
    get:
      tags:
      - negotiations
      summary: Get Negotiation
      operationId: get_negotiation_negotiations__negotiation_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: negotiation_id
        in: path
        required: true
        schema:
          type: integer
          title: Negotiation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NegotiationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /distance-table:
    get:
      tags:
      - distance-table
      summary: Get Current Distance Table
      operationId: get_current_distance_table_distance_table_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistanceTableOut'
  /connectivity:
    get:
      tags:
      - connectivity
      summary: Get Connectivity
      operationId: get_connectivity_connectivity_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectivityOut'
  /market/book:
    get:
      tags:
      - market
      summary: Read Market Book
      description: 'Por defecto, solo ofertas con remaining positivo y mercado abierto.


        includeInactive permite ver retiradas, cerradas e inciertas para auditoría.'
      operationId: read_market_book_market_book_get
      parameters:
      - name: cycleId
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          title: Cycleid
      - name: includeInactive
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Includeinactive
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBookOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /market/buy-candidates:
    get:
      tags:
      - market
      summary: Read Buy Candidates
      description: Solo lectura. Nunca encola bids ni opera fuera de la ventana oficial.
      operationId: read_buy_candidates_market_buy_candidates_get
      parameters:
      - name: cycleId
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          title: Cycleid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBuyCandidatesOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/market/bids:
    post:
      tags:
      - internal-market
      summary: Create Buy Bid
      description: Genera bid dirigido sin price; el ACK nunca marca aceptación comercial.
      operationId: create_buy_bid_internal_market_bids_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyBidIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /market/offers/{offer_id}/price:
    patch:
      tags:
      - seller-offers
      summary: Reprice
      operationId: reprice_market_offers__offer_id__price_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: offer_id
        in: path
        required: true
        schema:
          type: string
          title: Offer Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepriceIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /market/offers/{offer_id}/withdraw:
    post:
      tags:
      - seller-offers
      summary: Withdraw
      operationId: withdraw_market_offers__offer_id__withdraw_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: offer_id
        in: path
        required: true
        schema:
          type: string
          title: Offer Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /market/strategy:
    get:
      tags:
      - market-admin
      summary: Read Strategy
      description: No crea una estrategia por el simple hecho de consultar (GET sin
        writes).
      operationId: read_strategy_market_strategy_get
      parameters:
      - name: cycleId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
          title: Cycleid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyViewOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - market-admin
      summary: Update Strategy
      description: Crea una versión pendiente. El ciclo activo mantiene su versión
        fija.
      operationId: update_strategy_market_strategy_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyUpdateIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /market/strategies:
    get:
      tags:
      - market-admin
      summary: Read Strategy Versions
      description: Historial completo y ordenado de versiones de estrategia (AD6/RF06).
      operationId: read_strategy_versions_market_strategies_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StrategyOut'
                type: array
                title: Response Read Strategy Versions Market Strategies Get
  /market/strategy/options:
    get:
      tags:
      - market-admin
      summary: Read Strategy Options
      description: Valores oficiales soportados por la API para un editor frontend.
      operationId: read_strategy_options_market_strategy_options_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyOptionsOut'
  /market/strategy/audit:
    get:
      tags:
      - market-admin
      summary: Read Strategy Audit
      description: 'AD6: actor, versión, diferencias y primer ciclo efectivo. Solo
        lectura.


        strategy_configs es un historial versionado: los parámetros nunca se

        sobrescriben; únicamente evolucionan status y effective_from_cycle_id.'
      operationId: read_strategy_audit_market_strategy_audit_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyAuditOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /market/offers:
    get:
      tags:
      - market-admin
      summary: Read Local Offers
      description: Ofertas seller de nuestra ciudad, no reemplaza al libro del feed.
      operationId: read_local_offers_market_offers_get
      parameters:
      - name: cycleId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
          title: Cycleid
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalOffersOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /market/swaps:
    get:
      tags:
      - market-admin
      summary: Read Swaps
      operationId: read_swaps_market_swaps_get
      parameters:
      - name: cycleId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
          title: Cycleid
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 32
          - type: 'null'
          title: Status
      - name: role
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(PROPOSER|ACCEPTOR)$
          - type: 'null'
          title: Role
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /market/swaps/{record_id}:
    get:
      tags:
      - market-admin
      summary: Read Swap
      operationId: read_swap_market_swaps__record_id__get
      parameters:
      - name: record_id
        in: path
        required: true
        schema:
          type: integer
          title: Record Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /market/cycle-metrics/compare:
    get:
      tags:
      - market-rf06
      summary: Compare Cycle Metrics
      operationId: compare_cycle_metrics_market_cycle_metrics_compare_get
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(IN_PROGRESS|AWAITING_SETTLEMENT|AWAITING_TRANSPORT|FINAL)$
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleMetricsCompareOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
