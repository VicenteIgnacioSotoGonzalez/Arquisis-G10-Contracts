openapi: 3.1.0

info:
  title: EnergyShark E1 API
  version: 2.0.0
  description: |
    Contrato público de la API HTTP de EnergyShark para la Entrega 1.

    Esta especificación documenta las operaciones destinadas al frontend
    para consultar ciclos, conectividad, negociaciones y anomalías, además
    de crear propuestas de negociación.

    Las rutas internas usadas por connector y workers no están consideradas en
    este contrato.

tags:
  - name: cycles
    description: Consulta del historial y detalle de ciclos.

  - name: connectivity
    description: Consulta de la tabla de conectividad vigente.

  - name: negotiations
    description: Creación, seguimiento e historial de negociaciones.

  - name: audit
    description: Consulta de anomalías y evidencia de auditoría.

paths:
  /cycles:
    get:
      tags:
        - cycles
      summary: Listar ciclos
      description: |
        Retorna el historial de ciclos conocidos por el sistema,
        ordenados desde el más reciente al más antiguo.
      operationId: listCycles
      responses:
        "200":
          description: Historial de ciclos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CyclesOut"
              example:
                total: 1
                items:
                  - cycleId: cycle-9431
                    budgetBalance: "-50.00"
                    energyBalance: "30.00"
                    lastOperationType: DEMAND_STATEMENT
                    lastOperationAt: "2026-09-09T03:05:00Z"
                    reported: false

  /cycles/{cycle_id}:
    get:
      tags:
        - cycles
      summary: Obtener detalle de un ciclo
      description: |
        Retorna el estado persistido y reconstruido de un ciclo,
        incluyendo ledger, negociaciones, balances y
        negotiation-report cuando exista.
      operationId: getCycleDetail
      parameters:
        - name: cycle_id
          in: path
          required: true
          description: Identificador del ciclo.
          schema:
            type: string
      responses:
        "200":
          description: Detalle del ciclo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleDetailOut"
        "404":
          description: El ciclo solicitado no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
              example:
                detail: Cycle not found

  /connectivity:
    get:
      tags:
        - connectivity
      summary: Consultar conectividad vigente
      description: |
        Retorna la última distance-table persistida en una
        representación preparada para consumo desde frontend.

        El timestamp corresponde al mensaje distance-table fuente.
      operationId: getConnectivity
      responses:
        "200":
          description: Tabla de conectividad vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectivityOut"
              example:
                timestamp: "2026-09-09T03:25:00Z"
                total: 2
                items:
                  - destination: HGW
                    distance: 62763183
                    transportCost: 0.0034
                    enabled: true
                  - destination: TAR
                    distance: 94306517
                    transportCost: 0.0013
                    enabled: true
        "404":
          description: No existe una distance-table persistida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
              example:
                detail: Distance table not found
  /negotiations:
    get:
      tags:
        - negotiations
      summary: Listar negociaciones
      description: |
        Retorna todas las negociaciones persistidas, ordenadas desde
        la más reciente a la más antigua.
      operationId: listNegotiations
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista de negociaciones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NegotiationsOut"
        "401":
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
              examples:
                missingToken:
                  value:
                    detail: Not authenticated
                invalidToken:
                  value:
                    detail: Invalid token
                expiredToken:
                  value:
                    detail: Token has expired
        "503":
          description: Servicio de autenticación no disponible o mal configurado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
              examples:
                notConfigured:
                  value:
                    detail: Authentication is not configured
                jwksUnavailable:
                  value:
                    detail: Unable to fetch JWKS

    post:
      tags:
        - negotiations
      summary: Crear una propuesta de negociación
      description: |
        Crea una propuesta de negociación asociada a un ciclo.

        La creación es idempotente mediante idpk. Una nueva propuesta
        responde 201. Si el mismo idpk ya existe, se retorna la negociación
        persistida con 200 sin crear una segunda publicación.

        Un 201 indica que la intención de publicación fue persistida; no
        implica que la central ya haya aceptado la propuesta ni que el
        mensaje haya sido publicado en RabbitMQ.
      operationId: createNegotiation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NegotiationCreate"
            example:
              cycleId: cycle-9431
              idpk: 11111111-1111-4111-8111-111111111111
              direction: give
              requestedQuantity: "10.50"
              offeredPrice: "3.25"
      responses:
        "201":
          description: Propuesta creada y pendiente de publicación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NegotiationOut"
              example:
                id: 1
                idpk: 11111111-1111-4111-8111-111111111111
                cycleId: cycle-9431
                direction: give
                requestedQuantity: "10.50"
                offeredPrice: "3.25"
                status: PENDING_PUBLICATION
                confirmedEnergy: null
                confirmedPrice: null
                paymentQuantity: null
                deadlineAt: null
                createdAt: "2026-09-27T12:00:00Z"
                updatedAt: "2026-09-27T12:00:00Z"
        "200":
          description: |
            El idpk ya había sido procesado. Se retorna la negociación
            existente sin crear otra publicación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NegotiationOut"
        "401":
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
              example:
                detail: Not authenticated
        "404":
          description: El ciclo solicitado no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
              example:
                detail: Cycle not found
        "422":
          description: |
            Request inválido o propuesta rechazada por reglas de negocio.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HTTPValidationError"
                  - $ref: "#/components/schemas/HTTPError"
              examples:
                priceAboveCap:
                  value:
                    detail: PRICE_ABOVE_CAP
                overCapacity:
                  value:
                    detail: OVER_CAPACITY
                invalidDirection:
                  value:
                    detail:
                      - loc:
                          - body
                          - direction
                        msg: Input should be 'give' or 'take'
                        type: literal_error
        "503":
          description: Servicio de autenticación no disponible o mal configurado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
              example:
                detail: Unable to fetch JWKS
  /negotiations/{negotiation_id}:
    get:
      tags:
        - negotiations
      summary: Obtener detalle de una negociación
      description: |
        Retorna el estado y detalle persistido de una negociación.
      operationId: getNegotiation
      security:
        - BearerAuth: []
      parameters:
        - name: negotiation_id
          in: path
          required: true
          description: Identificador entero de la negociación.
          schema:
            type: integer
      responses:
        "200":
          description: Detalle de la negociación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NegotiationOut"
              example:
                id: 1
                idpk: 11111111-1111-4111-8111-111111111111
                cycleId: cycle-9431
                direction: give
                requestedQuantity: "10.50"
                offeredPrice: "3.25"
                status: PAID
                confirmedEnergy: "10.50"
                confirmedPrice: "3.25"
                paymentQuantity: "34.13"
                deadlineAt: null
                createdAt: "2026-09-27T12:00:00Z"
                updatedAt: "2026-09-27T12:01:00Z"
        "401":
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
              example:
                detail: Not authenticated
        "404":
          description: La negociación solicitada no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
              example:
                detail: Negotiation not found
        "422":
          description: negotiation_id no cumple el tipo esperado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "503":
          description: Servicio de autenticación no disponible o mal configurado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
              example:
                detail: Unable to fetch JWKS
  /audit/anomalies:
    get:
      tags:
        - audit
      summary: Listar anomalías de mensajes
      description: |
        Retorna evidencia pública de mensajes duplicados, descartados
        o respondidos con NACK.

        Los filtros se combinan mediante igualdad. El resultado siempre
        se restringe a anomalías con estado DUPLICATE, DISCARDED o NACKED.

        El campo total representa la cantidad total de coincidencias antes
        de aplicar limit, por lo que puede ser mayor que la cantidad de
        elementos retornados en items.
      operationId: listAuditAnomalies
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra por estado de anomalía.
          schema:
            type: string
            enum:
              - DUPLICATE
              - DISCARDED
              - NACKED

        - name: type
          in: query
          required: false
          description: Filtra por tipo de mensaje del protocolo.
          schema:
            type: string

        - name: reasonCode
          in: query
          required: false
          description: Filtra por código de razón asociado a la anomalía.
          schema:
            type: string

        - name: msgId
          in: query
          required: false
          description: |
            Filtra por msgId. Se mantiene como string porque una anomalía
            puede representar un mensaje malformado.
          schema:
            type: string

        - name: idpk
          in: query
          required: false
          description: |
            Filtra por idpk. Se mantiene como string porque una anomalía
            puede representar un mensaje malformado.
          schema:
            type: string

        - name: limit
          in: query
          required: false
          description: Cantidad máxima de elementos retornados.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100

      responses:
        "200":
          description: Lista de anomalías que cumplen los filtros.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditAnomalyListOut"
              example:
                total: 1
                items:
                  - id: 1
                    msgId: 22222222-2222-4222-8222-222222222222
                    idpk: 33333333-3333-4333-8333-333333333333
                    type: status-statement
                    cycleId: cycle-9431
                    status: NACKED
                    reasonCode: MALFORMED_MESSAGE
                    reason: Falta data.energy.consumption
                    receivedAt: "2026-09-27T12:00:00Z"
                    processedAt: "2026-09-27T12:00:01Z"
                    relatedMsgId: 22222222-2222-4222-8222-222222222222

        "422":
          description: Alguno de los filtros no cumple las restricciones esperadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT emitido por Auth0.
        Debe enviarse mediante el header:
        Authorization: Bearer <token>

  schemas:
    DecimalString:
      type: string
      description: Valor decimal serializado como string.
      examples:
        - "10.50"

    DecimalInputPositive:
      oneOf:
        - type: number
          exclusiveMinimum: 0
        - type: string
      description: |
        Valor decimal estrictamente mayor que cero.
        El backend acepta números JSON y strings decimales.

    DecimalInputNonNegative:
      oneOf:
        - type: number
          minimum: 0
        - type: string
      description: |
        Valor decimal mayor o igual que cero.
        El backend acepta números JSON y strings decimales.

    HTTPError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
      examples:
        - detail: Cycle not found

    ValidationError:
      type: object
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"

    NegotiationCreate:
      type: object
      required:
        - cycleId
        - idpk
        - direction
        - requestedQuantity
        - offeredPrice
      properties:
        cycleId:
          type: string
          description: Identificador del ciclo asociado.
        idpk:
          type: string
          format: uuid
          description: Identificador lógico utilizado para idempotencia.
        direction:
          type: string
          enum:
            - give
            - take
        requestedQuantity:
          $ref: "#/components/schemas/DecimalInputPositive"
        offeredPrice:
          $ref: "#/components/schemas/DecimalInputNonNegative"

    NegotiationOut:
      type: object
      required:
        - id
        - idpk
        - cycleId
        - direction
        - requestedQuantity
        - offeredPrice
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        idpk:
          type: string
        cycleId:
          type: string
        direction:
          type: string
          description: |
            Dirección de la negociación.
            Valores actuales conocidos: give, take.
        requestedQuantity:
          $ref: "#/components/schemas/DecimalString"
        offeredPrice:
          $ref: "#/components/schemas/DecimalString"
        status:
          type: string
          description: |
            Estado actual de la negociación.
            Valores conocidos:
            PENDING_PUBLICATION, PROPOSED, ACKNOWLEDGED,
            CONFIRMED, PAID, REJECTED y TIMEOUT.
        confirmedEnergy:
          type:
            - string
            - "null"
          default: null
        confirmedPrice:
          type:
            - string
            - "null"
          default: null
        paymentQuantity:
          type:
            - string
            - "null"
          default: null
        deadlineAt:
          type:
            - string
            - "null"
          format: date-time
          default: null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NegotiationsOut:
      type: object
      required:
        - total
        - items
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/NegotiationOut"

    LedgerEntryOut:
      type: object
      required:
        - sequence
        - operationType
        - budgetDelta
        - energyDelta
        - budgetAfter
        - energyAfter
        - appliedAt
        - details
      properties:
        sequence:
          type: integer
        operationType:
          type: string
          description: |
            Tipo de operación del ledger.
            Valores actuales conocidos incluyen TRANSFER_IN,
            DEMAND_STATEMENT, GIVE_CONFIRMED, TAKE_CONFIRMED,
            PAYMENT_RECEIVED y PAYMENT_SENT.
        budgetDelta:
          $ref: "#/components/schemas/DecimalString"
        energyDelta:
          $ref: "#/components/schemas/DecimalString"
        budgetAfter:
          $ref: "#/components/schemas/DecimalString"
        energyAfter:
          $ref: "#/components/schemas/DecimalString"
        appliedAt:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true

    NegotiationReportOut:
      type: object
      required:
        - msgId
        - idpk
        - budgetBalance
        - energyBalance
        - createdAt
      properties:
        msgId:
          type: string
        idpk:
          type: string
        budgetBalance:
          $ref: "#/components/schemas/DecimalString"
        energyBalance:
          $ref: "#/components/schemas/DecimalString"
        createdAt:
          type: string
          format: date-time
        sentAt:
          type:
            - string
            - "null"
          format: date-time
          default: null

    CycleSummaryOut:
      type: object
      required:
        - cycleId
        - budgetBalance
        - energyBalance
        - lastOperationType
        - lastOperationAt
        - reported
      properties:
        cycleId:
          type: string
        budgetBalance:
          $ref: "#/components/schemas/DecimalString"
        energyBalance:
          $ref: "#/components/schemas/DecimalString"
        lastOperationType:
          type:
            - string
            - "null"
        lastOperationAt:
          type:
            - string
            - "null"
          format: date-time
        reported:
          type: boolean
          description: |
            Indica que existe un negotiation-report persistido.
            No implica necesariamente que el reporte ya haya sido publicado.

    CyclesOut:
      type: object
      required:
        - total
        - items
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/CycleSummaryOut"

    CycleDetailOut:
      type: object
      required:
        - cycleId
        - statusStatement
        - fundsReceived
        - demandStatements
        - negotiations
        - negotiationReport
        - finalBudgetBalance
        - finalEnergyBalance
        - lastOperation
        - reconstructedBudgetBalance
        - reconstructedEnergyBalance
        - snapshotConsistent
        - ledger
      properties:
        cycleId:
          type: string
        statusStatement:
          type: object
          additionalProperties: true
          description: |
            Contenido data del último status-statement asociado al ciclo.
            Habitualmente contiene energy y validUntil según el contrato
            del protocolo v2.
          examples:
            - energy:
                generationCapacity: 1234512
                consumption: 1444121
                generationCost: 210
              validUntil: "2026-09-09T03:20:00Z"
        fundsReceived:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntryOut"
        demandStatements:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntryOut"
        negotiations:
          type: array
          items:
            $ref: "#/components/schemas/NegotiationOut"
        negotiationReport:
          anyOf:
            - $ref: "#/components/schemas/NegotiationReportOut"
            - type: "null"
        finalBudgetBalance:
          $ref: "#/components/schemas/DecimalString"
        finalEnergyBalance:
          $ref: "#/components/schemas/DecimalString"
        lastOperation:
          anyOf:
            - $ref: "#/components/schemas/LedgerEntryOut"
            - type: "null"
        reconstructedBudgetBalance:
          $ref: "#/components/schemas/DecimalString"
        reconstructedEnergyBalance:
          $ref: "#/components/schemas/DecimalString"
        snapshotConsistent:
          type: boolean
        ledger:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntryOut"

    ConnectivityItemOut:
      type: object
      required:
        - destination
        - distance
        - transportCost
        - enabled
      properties:
        destination:
          type: string
        distance:
          type: number
        transportCost:
          type: number
        enabled:
          type: boolean

    ConnectivityOut:
      type: object
      required:
        - timestamp
        - total
        - items
      properties:
        timestamp:
          type: string
          format: date-time
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConnectivityItemOut"

    AuditAnomalyOut:
      type: object
      required:
        - id
        - msgId
        - idpk
        - type
        - cycleId
        - status
        - reasonCode
        - reason
        - receivedAt
        - processedAt
        - relatedMsgId
      properties:
        id:
          type: integer
        msgId:
          type:
            - string
            - "null"
        idpk:
          type:
            - string
            - "null"
        type:
          type:
            - string
            - "null"
        cycleId:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - DUPLICATE
            - DISCARDED
            - NACKED
        reasonCode:
          type:
            - string
            - "null"
        reason:
          type:
            - string
            - "null"
        receivedAt:
          type: string
          format: date-time
        processedAt:
          type:
            - string
            - "null"
          format: date-time
        relatedMsgId:
          type:
            - string
            - "null"

    AuditAnomalyListOut:
      type: object
      required:
        - total
        - items
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditAnomalyOut"
